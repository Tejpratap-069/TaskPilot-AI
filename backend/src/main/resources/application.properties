spring.application.name=taskpilot-backend
server.port=${PORT:${SERVER_PORT:8080}}

# ---- Primary datasource: MySQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskpilot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:taskpilot}
spring.datasource.password=${DB_PASSWORD:taskpilot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:taskpilot-dev-secret-key-change-me-in-production-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Python NLP service ----
app.ai.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.timeout-ms=${AI_TIMEOUT_MS:4000}

# ---- Optional demo account (created only when both are set) ----
app.demo.email=${DEMO_USER_EMAIL:}
app.demo.password=${DEMO_USER_PASSWORD:}
app.demo.name=${DEMO_USER_NAME:Demo User}

springdoc.swagger-ui.path=/swagger-ui.html
